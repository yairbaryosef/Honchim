<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign as Cadet or Elder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: 'Open Sans', sans-serif;
            direction: rtl;
        }

        .navbar {
            background: crimson;
            font-family: calibri;
            padding-right: 15px;
            padding-left: 15px;
        }

        .navdiv {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo a {
            font-size: 35px;
            font-weight: 600;
            color: white;
            text-decoration: none;
        }

        button {
            background-color: black;
            margin-left: 10px;
            border-radius: 10px;
            padding: 10px;
            width: 100px;
            border: none;
            cursor: pointer;
        }

        button a {
            color: white;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
        }

        /* Form styling */
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
            color: crimson;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="file"] {
            padding: 3px;
        }

        button[type="submit"] {
            width: 100%;
            background-color: crimson;
            color: white;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: darkred;
        }

        .custom-button {
            background-color: black;
            color: white;
            padding: 10px;
            margin-top: -10px;
            cursor: pointer;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }

            label {
                font-size: 16px;
            }

            input, select, textarea {
                font-size: 14px;
            }

            button[type="submit"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo"><a href="#">מערכת שיעורי עזר</a></div>
            <button><a href="/logout">התנתקות</a></button>
        </div>
    </nav>

    <div class="form-container">
        <form action="{{ url_for('register2') }}" method="POST" enctype="multipart/form-data">
            <label for="name">שם:</label>
            <input type="text" id="name" name="name" placeholder="הזן שם מלא">

            <label for="type">סוג:</label>
            <select id="type" name="type">
                <option value="חניך">חניך</option>
                <option value="חונך">חונך</option>
            </select>

            <label for="year">שנה:</label>

            <select type="number" id="year" name="year" placeholder="הזן את שנת הלימודים שלך">
                <option value="שנה ראשונה">שנה ראשונה</option>
                <option value="שנה שנייה">שנה שנייה</option>
                 <option value="שנה שלישית">שנה שלישית</option>
                 <option value="שנה רביעית ומעלה"> שנה רביעית ומעלה</option>

            </select>

            <label for="degree">תואר:</label>
            <select id="degree" name="degree"></select>

            <label for="university">אוניברסיטה:</label>
            <select id="university" name="university"></select>

            <label for="phone">טלפון:</label>
            <input type="tel" id="phone" name="phone" placeholder="הזן את מספר הטלפון שלך">

            <label id="help-label" for="help">תחומי עזרה (אם קיימים מספר תחומים, יש לרשום אותם מופרדים בפסיק)</label>

            <select id="help" name="help"></select>

            <button type="button" id="add-help" class="custom-button">הוסף עזרה</button>

            <label for="profile-picture">תמונת פרופיל:</label>
            <input type="file" id="profile-picture" name="profile-picture" accept="image/*">

            <label for="grades">ציונים:</label>
            <input type="file" id="grades" name="grades" accept=".pdf">

            <label for="description">תיאור:</label>
            <textarea id="description" name="description" placeholder="ספר לנו על עצמך"></textarea>

            <button type="submit">שלח</button>
        </form>
    </div>

    <script>
        const universitySelect = document.getElementById('university');
        const degreeSelect = document.getElementById('degree');
        const helpSelect = document.getElementById('help');

        // populate university options
        const universities = [
        "(צפון) אוניברסיטת חיפה",
        "(צפון) הטכניון חיפה",
        "(צפון) מרכז האקדמי ויצו",
        "(צפון) מכללת עמק יזרעאל",
        "(צפון) מכללת רופין",
        "(צפון) מכללת צמח עמק הירדן",
        "(צפון) מכללת צפת",
        "(צפון) מכללת בראודה",
        "(מרכז) אוניברסיטת אריאל",
        "(מרכז) אוניברסיטת תל אביב",
        "(מרכז) אוניברסיטת בר אילן",
        "(מרכז) אוניברסיטת רייכמן",
        "(מרכז) מכללת אפקה",
        "(מרכז) מכון לב",
        "(מרכז) האוניברסיטה העברית",
        "(מרכז) מכללת עזריאלי ירושלים",
        "(מרכז) מכללת הדסה ירושלים",
        "(מרכז) מכון טכנולוגי חולון (HIT)",
        "(מרכז) מכללת פרס",
        "(מרכז) מכללת תל חי",
        "(מרכז) המכללה האקדמית ווינגייט",
        "(מרכז) מכללת שנקר",
        "(מרכז) המכללה למנהל",
        "(דרום) אוניברסיטת בן גוריון",
        "(דרום) מכללת סמי שמעון",
        "(דרום) מכללת ספיר הנגב"
        ];

        universities.forEach(university => {
            const option = document.createElement('option');
            option.value = university;
            option.text = university;
            universitySelect.appendChild(option);
        });

        const degrees = [
        "אדריכלות",
        "אימון גופני",
        "ביוטכנולוגיה",
        "ביולוגיה",
        "ביולוגיה חישובית",
        "גיאואינפורמציה",
        "גיאוגרפיה",
        "גיאולוגיה",
        "גיאופיזיקה",
        "הוראה",
        "הנד' מער' תקשורת",
        "הנדסה אזרחית",
        "הנדסה ביו רפואית",
        "הנדסה גאודטית",
        "הנדסה כימית",
        "הנדסה פלסטית",
        "הנדסת אווירונאוטיקה וחלל",
        "הנדסת אלקטרואופטיקה",
        "הנדסת חומרים",
        "הנדסת חשמל ואלק'",
        "הנדסת מחשבים",
        "הנדסת מכונות",
        "הנדסת מערכות מידע",
        "הנדסת נתונים ומידע",
        "הנדסת תוכנה",
        "הנדסת תעשייה וניהול",
        "חשבונאות",
        "כימיה",
        "כלכלה",
        "לוגיסטיקה",
        "מדעי המחשב",
        "מדעי מעבדה רפואי",
        "משפטים",
        "מתמטיקה יישומית",
        "משאבי אנוש",
        "ניהול מערכות מידע",
        "סיעוד",
        "פיזוטרפיה",
        "פיזיקה",
        "פסיכולוגיה ארגונית",
        "רובוטיקה",
        "רוקחות",
        "רפואה כללית",
        "רפואה כללית - צמרת - עילית",
        "רפואת חירום (ב\"א)",
        "רפואת שיניים"
        ]

        degrees.forEach(degree => {
                const option = document.createElement('option');
                option.value = degree;
                option.text = degree;
                degreeSelect.appendChild(option);
            });
        // populate help options
        const helps = ['Help 1', 'Help 2', 'Help 3'];
        helps.forEach(help => {
            const option = document.createElement('option');
            option.value = help;
            option.text = help;
            helpSelect.appendChild(option);
        });



        document.getElementById('add-help').addEventListener('click', () => {
            const newHelp = prompt('הזן עזרה חדשה:');
            if (newHelp) {
                const option = document.createElement('option');
                option.value = newHelp;
                option.text = newHelp;
                helpSelect.appendChild(option);
            }
        });
        document.getElementById('type').addEventListener('change', function() {
    const helpLabel = document.getElementById('help-label');
    if (this.value === 'חניך') {
        helpLabel.textContent = 'תחומי עזרה (אם קיימים מספר תחומים, יש לרשום אותם מופרדים בפסיק)';
    } else if (this.value === 'חונך') {
        helpLabel.textContent = 'תחומי חונכות (אם קיימים מספר תחומים, יש לרשום אותם מופרדים בפסיק)';
    }
});

    </script>
</body>
</html>
