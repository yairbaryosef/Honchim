<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&display=swap');

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Assistant', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .card h1 {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .card p {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            text-align: right;
            direction: rtl;
        }

        .form-control {
            background-color: #F7F7F7;
            border-radius: 20px;
            margin-bottom: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        .form-control input {
            flex: 1;
            border: none;
            background-color: transparent;
            font-size: 16px;
            padding: 5px;
            outline: none;
            text-align: right;
            direction: rtl;
            color: #333;
        }

        .form-control i {
            color: #999;
            margin-left: 10px;
        }

        .btn-container {
            margin-top: 10px;
        }

        .btn {
            background-color: #FF5C5C;
            color: white;
            font-size: 18px;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn:hover {
            background-color: #FF3333;
        }

        .card footer {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }

        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .language-switcher button {
            background: none;
            border: 2px solid white;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
        }

        .language-switcher button:hover {
            background-color: white;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <button onclick="switchLanguage()">עברית / English</button>
    </div>
    <div class="container">
        <div class="card">
            <h1>שיעורי עזר</h1>
             <img src="static/Images/about-logo.png" alt="Logo" style="width: 150px; height: 150px;">



            <form action="/login" method="POST">
                <div class="form-control">
                    <i class="fa fa-id-card"></i>
                    <input type="text" placeholder="תעודת זהות" name="username" required>
                </div>
                <div class="form-control">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="סיסמא" name="password" required>
                </div>
                <div class="btn-container">
                    <button class="btn" type="submit">כניסה</button>
                </div>
            </form>
              <p>
                עתודאים יקרים, על מנת להיכנס למערכת חניכה השתמשו בפרטי גישה שלכם שקיבלתם במסרון.
                במידה ואינכם קיבלתם מסרון נא צרו קשר עם מוקד עתודה אקדמית 052-9064924
            </p>
            <footer>© 2024 כל הזכויות שמורות</footer>
        </div>
    </div>
    <script>
        function switchLanguage() {
            const lang = document.documentElement.lang === "he" ? "en" : "he";
            document.documentElement.lang = lang;
            if (lang === "en") {
                document.querySelector('h1').innerText = 'Tutoring';
                document.querySelector('input[name="username"]').placeholder = 'ID Number';
                document.querySelector('input[name="password"]').placeholder = 'Password';
                document.querySelector('.btn').innerText = 'Login';
                document.querySelector('footer').innerText = '© 2024 All rights reserved';
                document.querySelector('.card p').innerText = 'Dear students, please use your access details sent via SMS to log in. If you did not receive an SMS, contact the Academic Reserve Center at 052-9064924.';
            } else {
                document.querySelector('h1').innerText = 'שיעורי עזר';
                document.querySelector('input[name="username"]').placeholder = 'תעודת זהות';
                document.querySelector('input[name="password"]').placeholder = 'סיסמא';
                document.querySelector('.btn').innerText = 'כניסה';
                document.querySelector('footer').innerText = '© 2024 כל הזכויות שמורות';
                document.querySelector('.card p').innerText = 'עתודאים יקרים, על מנת להיכנס למערכת חניכה השתמשו בפרטי גישה שלכם שקיבלתם במסרון. במידה ואינכם קיבלתם מסרון נא צרו קשר עם מוקד עתודה אקדמית 052-9064924';
            }
        }
    </script>
</body>
</html>
